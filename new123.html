  <title>Sri Lanka Economic Outlook — Figma Embed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .embed-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }

    .embed-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <main class="embed-container">
    <iframe
      src="https://embed.figma.com/site/7QcHz7g80PBL8MaBqzBse1/Untitled?node-id=39-717&embed-host=share"
