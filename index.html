<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Issue Project</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    .view-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: none;
    }

    .view-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Desktop screens (wider than 768px) */
    @media (min-width: 769px) {
      .desktop-view {
        display: block;
      }
    }

    /* Mobile screens (768px or narrower) */
    @media (max-width: 768px) {
      .mobile-view {
        display: block;
      }
    }
  </style>
</head>
<body>
  <!-- Desktop Version -->
  <div class="view-frame desktop-view">
    <iframe
      src="https://embed.figma.com/site/7QcHz7g80PBL8MaBqzBse1/Untitled?node-id=0-1&embed-host=share"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Mobile Version -->
  <div class="view-frame mobile-view">
    <iframe
      src="https://embed.figma.com/site/7QcHz7g80PBL8MaBqzBse1/Untitled?node-id=0-1&embed-host=share"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
